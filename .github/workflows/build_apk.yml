name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Flutter Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Environment
        run: flutter doctor -v

      - name: Install Dependencies
        working-directory: mobile_app
        run: flutter pub get

      - name: Build Release APK
        working-directory: mobile_app
        run: flutter build apk --release

      - name: Rename APK for Distribution
        run: |
          mkdir -p dist
          cp mobile_app/build/app/outputs/flutter-apk/app-release.apk dist/QE-NIDS-ThreatGuard.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QE-NIDS-ThreatGuard-APK
          path: dist/QE-NIDS-ThreatGuard.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-android
          name: "QE-NIDS ThreatGuard Android v1.0.0"
          body: |
            ## 📱 QE-NIDS ThreatGuard — Android Release (Flutter)
            
            Directly installable APK for Android mobile devices.
            
            ### Features:
            - **Flutter Material 3 Cyber-SOC UI**: Neon radial risk gauge, 4-model breakdown, live telemetry.
            - **4-Model Detection Engine**: Random Forest, Isolation Forest, PyTorch Autoencoder, Qiskit Quantum Kernel.
            - **Consent-based Monitoring**: Battery-optimized background scanning.
            - **Live Test Attack Injection**: Simulated DDoS, PortScan, and Novel Zero-Day threat triggers.
            
            ### How to Install:
            1. Download `QE-NIDS-ThreatGuard.apk` on your Android phone.
            2. Tap the downloaded file and select **Install**.
            3. Grant notification & network inspection permissions when prompted.
          files: dist/QE-NIDS-ThreatGuard.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
